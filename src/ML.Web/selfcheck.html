<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ML Walking Skeleton</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16181d;
      --panel: #1e2128;
      --line: #2c3038;
      --text: #e6e8ec;
      --dim: #8b919e;
      --ok: #4ade80;
      --wait: #6b7280;
      --fail: #f87171;
      --accent: #7c9cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, #232735, var(--bg));
      color: var(--text);
      font: 14px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(720px, 92vw);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 30px 26px;
      box-shadow: 0 24px 60px -24px #000a;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: .2px;
    }

    .sub {
      margin: 0 0 22px;
      color: var(--dim);
      font-size: 12.5px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    li:last-child { border-bottom: 0; }

    .mark {
      width: 20px;
      flex: 0 0 20px;
      font-size: 15px;
      color: var(--wait);
      text-align: center;
    }

    li.ok .mark { color: var(--ok); }
    li.fail .mark { color: var(--fail); }

    .label { flex: 1 1 auto; }

    .detail {
      color: var(--dim);
      font-family: "Cascadia Mono", ui-monospace, monospace;
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12.5px;
      color: var(--dim);
    }

    .verdict { font-weight: 600; }
    .verdict.pass { color: var(--ok); }
    .verdict.fail { color: var(--fail); }

    button {
      font: inherit;
      font-size: 12.5px;
      color: var(--text);
      background: #2a2f3a;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
    }

    button:hover { background: #333947; }
    button:disabled { opacity: .45; cursor: default; }
  </style>
</head>

<body>
  <div class="card">
    <h1>ML Walking Skeleton</h1>
    <p class="sub">四个集成边界 · 一次跑通，任何一环断掉都不算通过</p>

    <ul>
      <li id="b1" class="ok">
        <span class="mark">✓</span>
        <span class="label">① Kestrel 本地服务</span>
        <span class="detail" id="d1">页面由宿主 HTTP 服务提供</span>
      </li>
      <li id="b2">
        <span class="mark">·</span>
        <span class="label">② WebView2 加载页面</span>
        <span class="detail" id="d2">等待 CoreWebView2 就绪</span>
      </li>
      <li id="b3">
        <span class="mark">·</span>
        <span class="label">③ JS ↔ .NET 桥往返</span>
        <span class="detail" id="d3">未测量</span>
      </li>
      <li id="b4">
        <span class="mark">·</span>
        <span class="label">④ Node 子进程插件握手</span>
        <span class="detail" id="d4">未测量</span>
      </li>
    </ul>

    <footer>
      <span>桥接：<code>chrome.webview.postMessage</code> / <code>PostWebMessageAsJson</code></span>
      <span class="verdict" id="verdict">运行中…</span>
    </footer>
  </div>

  <script type="module" src="./selfcheck.js"></script>
</body>

</html>
